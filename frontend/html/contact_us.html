<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/contact_us.css') }}">
    <script src="{{ url_for('static', filename='js/contact_us.js') }}"></script>
</head>

<body>
    <header>
        <nav>
            <ul>
                <li><a href="{{ url_for('static', filename='html/faq.html') }}">FAQS</a></li>
                <li><a href="{{ url_for('static', filename='html/home.html') }}">Home</a></li>
                <li><a href="{{ url_for('static', filename='html/shopping_cart.html') }}">Shopping Cart</a></li>
                <li><a href="{{ url_for('static', filename='html/logout.html') }}">Logout</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h1>Contact Us</h1>
        <p>We'd love to hear from you! Please fill out the form below and we'll get back to you as soon as possible.</p>

        <form action="#" method="post">
            <div>
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required>
            </div>

            <div>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div>
                <label for="message">Message:</label>
                <textarea id="message" name="message" rows="5" required></textarea>
            </div>

            <input type="submit" value="Send Message">
        </form>
    </main>

    <footer>
        <p>&copy; 2024 Electronic ShopStore. All rights reserved.</p>
    </footer>
</body>

</html>
