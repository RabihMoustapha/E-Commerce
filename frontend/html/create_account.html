<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/create_account.css') }}">
    <script src="{{ url_for('static', filename='js/create_account.js') }}"></script>
</head>

<body>
    <header>
        <nav>
            <ul>
                <li><a href="{{ url_for('static', filename='html/contact_us.html') }}">Contact US</a></li>
                <li><a href="{{ url_for('static', filename='html/faq.html') }}">FAQS</a></li>

                <li><a href="{{ url_for('static', filename='html/logout.html') }}">Logout</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <form action="../../backend/create_account.py" method="post">
            <h2>Create Account</h2>
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required><br><br>
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required><br><br>
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required><br><br>
            <label for="image">Profile Picture (Optional)</label>
            <input type="file" id="image" name="image" accept=".jpg, .jpeg, .png"><br><br>
            <input type="submit" value="Sign UP" onclick=" return validateCreateForm()">
        </form>
    </main>
